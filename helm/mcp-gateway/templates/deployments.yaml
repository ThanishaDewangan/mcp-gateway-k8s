apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-content
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.store.persistence.storageClass }}
  storageClassName: {{ .Values.store.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.store.persistence.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.database.persistence.storageClass }}
  storageClassName: {{ .Values.database.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.database.persistence.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcp-gateway-data
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.dataPersistence.storageClass }}
  storageClassName: {{ .Values.dataPersistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.dataPersistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
spec:
  selector:
    app.kubernetes.io/name: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
    spec:
      containers:
        - name: mariadb
          image: {{ .Values.database.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: wordpress
            - name: MARIADB_USER
              value: wordpress
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: mariadb-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: mariadb-root-password
          volumeMounts:
            - name: database
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$MARIADB_ROOT_PASSWORD\""]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$MARIADB_ROOT_PASSWORD\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: mariadb-data
---
apiVersion: v1
kind: Service
metadata:
  name: store
spec:
  selector:
    app.kubernetes.io/name: wordpress
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
    spec:
      containers:
        - name: wordpress
          image: {{ .Values.store.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb:3306
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: mariadb-password
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_SITE_URL
              value: {{ printf "%s://%s" .Values.store.siteScheme .Values.store.host | quote }}
            - name: WORDPRESS_SITE_TITLE
              value: Urumi Demo Store
            - name: WORDPRESS_ADMIN_USER
              value: store-admin
            - name: WORDPRESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: wordpress-admin-password
            - name: WORDPRESS_ADMIN_EMAIL
              value: admin@example.invalid
            - name: WORDPRESS_CONFIG_EXTRA
              value: {{ printf "if (isset($_SERVER['HTTP_X_FORWARDED_HOST'])) { $_SERVER['HTTP_HOST'] = $_SERVER['HTTP_X_FORWARDED_HOST']; } if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $_SERVER['HTTPS'] = 'on'; }" | quote }}
          volumeMounts:
            - name: content
              mountPath: /var/www/html
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /wp-login.php
              port: http
            failureThreshold: 60
            periodSeconds: 5
          resources:
            {{- toYaml .Values.store.resources | nindent 12 }}
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: wordpress-content
---
apiVersion: v1
kind: Service
metadata:
  name: store-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: store-mcp
  ports:
    - name: http
      port: {{ .Values.storeMcp.port }}
      targetPort: {{ .Values.storeMcp.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: store-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: store-mcp
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: store-mcp
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: SERVICE
              value: store-mcp
            - name: PORT
              value: {{ .Values.storeMcp.port | quote }}
            - name: STORE_BACKEND
              value: {{ .Values.storeMcp.backend | quote }}
            - name: WOOCOMMERCE_URL
              value: {{ .Values.storeMcp.wooCommerceUrl | quote }}
            - name: WOOCOMMERCE_HOST
              value: {{ .Values.store.host | quote }}
            - name: WOOCOMMERCE_SCHEME
              value: {{ .Values.store.siteScheme | quote }}
            - name: WOOCOMMERCE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: woocommerce-consumer-key
            - name: WOOCOMMERCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: woocommerce-consumer-secret
            - name: STORE_MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: store-mcp-auth-token
          ports:
            - name: http
              containerPort: {{ .Values.storeMcp.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.storeMcp.resources | nindent 12 }}
---
